name: Symlink Consumer
on:
  workflow_run:
    workflows: ["Producer Bench"]
    types:
      - completed
jobs:
  create-comment:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: prepare victim file (stands in for github-script dist/index.js)
        run: |
          mkdir -p /tmp/proof
          printf '#!/bin/sh\necho ORIGINAL-NO-RCE\n' > /tmp/proof/next-step.sh
          chmod +x /tmp/proof/next-step.sh
      - name: 'Download artifact'
        uses: actions/github-script@v3.1.0
        with:
          script: |
            var artifacts = await github.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: ${{github.event.workflow_run.id }},
            });
            var matchArtifact = artifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "md-output"
            })[0];
            var download = await github.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            var fs = require('fs');
            fs.writeFileSync('${{ runner.temp }}/md-output.zip', Buffer.from(download.data));

      - name: unzip benchmark markdown files
        run: |
          mkdir -p ${{ runner.temp }}/pr-output/
          unzip -o ${{ runner.temp }}/md-output.zip -d ${{ runner.temp }}/pr-output/

      - name: inspect extracted
        run: ls -la ${{ runner.temp }}/pr-output/

      - name: Merge output files
        shell: bash
        run: sed h ${{ runner.temp }}/pr-output/*-output.md > ${{ runner.temp }}/pr-output/merged.md

      - name: prove execution
        run: |
          echo "--- extracted:"; ls -la ${{ runner.temp }}/pr-output/
          echo "--- victim content:"; cat /tmp/proof/next-step.sh
          echo "--- executing victim:"; /tmp/proof/next-step.sh
